name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        path: sutra-community
    - uses: actions/checkout@v4
      with:
        repository: MacCracken/sutra
        path: sutra
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - run: cargo fmt --all -- --check
      working-directory: sutra-community

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        path: sutra-community
    - uses: actions/checkout@v4
      with:
        repository: MacCracken/sutra
        path: sutra
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: sutra-community
    - run: cargo clippy --workspace --all-targets -- -D warnings
      working-directory: sutra-community

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        path: sutra-community
    - uses: actions/checkout@v4
      with:
        repository: MacCracken/sutra
        path: sutra
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: sutra-community
    - run: cargo test --workspace
      working-directory: sutra-community
